<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tentang Saya</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="overlay"></div>
        <audio id="bg-music" src="aset/lagu.opus" preload="auto" loop></audio>

        <div class="container">
            <div id="envelope-section" class="card">
                <div class="envelope-box" id="open-envelope">
                    <div class="envelope-icon-inner">⚫</div>
                </div>
                <h2>Ayo kita lihat seberapa dekat kita</h2>
                <p>Ketuk amplop untuk mulai dan jawab pertanyanku! </p>
            </div>

            <div id="name-section" class="card hidden">
                <h2>Kenalan Dulu Yuk</h2>
                <p>Masukkan nama kamu sebelum mulai:</p>
                <input
                    type="text"
                    id="player-name"
                    placeholder="Ketik nama kamu..."
                />
                <button id="start-btn">Mulai Kuis</button>
            </div>

            <div id="quiz-section" class="card hidden">
                <div class="quiz-header">
                    <span id="question-counter">Soal 1 dari 10</span>
                    <span id="score-display">Poin: 0</span>
                </div>
                <h3 id="question-text">Pertanyaan akan muncul di sini...</h3>
                <div id="options-container" class="options-grid"></div>
            </div>

            <div id="result-section" class="card hidden">
                <h2>Selesai!</h2>
                <p id="result-message"></p>
                <h1 id="final-score">Skor: 0</h1>
            </div>
        </div>

        <script type="module" src="js/script.js"></script>
    </body>
</html>
